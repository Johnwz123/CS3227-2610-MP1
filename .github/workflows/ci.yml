name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verify Java project and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify Java code and quality gates
        run: xvfb-run --auto-servernum ./gradlew check jacocoTestReport javadoc

      - name: Summarize JaCoCo coverage
        id: coverage
        run: |
          python3 scripts/summarize_jacoco.py \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish pull-request coverage comment
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage.outputs.summary }}
        with:
          script: |
            const marker = '<!-- budgetbot-jacoco-coverage -->';
            const body = `${marker}\n${process.env.COVERAGE_SUMMARY}`;
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const { data: comments } = await github.rest.issues.listComments(parameters);
            const existingComment = comments.find(
              comment => comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                ...parameters,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...parameters, body });
            }

      - name: Install documentation dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site
        working-directory: website
        run: npm run build

      - name: Upload reports
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: build/reports/
          if-no-files-found: error
