name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Java project and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Verify Java code and quality gates
        run: ./gradlew check jacocoTestReport javadoc

      - name: Install documentation dependencies
        working-directory: website
        run: npm ci

      - name: Build documentation site
        working-directory: website
        run: npm run build

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: build/reports/
          if-no-files-found: error
